<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Chq & Cash Receiving</title>
<meta name="theme-color" content="#7a3fb5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chq & Cash">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  html,body{margin:0;height:100%;background:#ebe6fb;overflow:hidden;font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif}
  #app{position:fixed;inset:0;width:100%;height:100%;border:0;padding-top:env(safe-area-inset-top);box-sizing:border-box;background:#ebe6fb}
  #splash,#off,#setup{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    background:linear-gradient(135deg,#7a3fb5 0%,#c1449a 40%,#e14f78 70%,#f5823a 100%);color:#fff;text-align:center;padding:24px;box-sizing:border-box;z-index:5}
  .logo{width:84px;height:84px;border-radius:24px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font:800 44px sans-serif}
  .spin{width:30px;height:30px;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:s 0.9s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  button{border:0;background:#fff;color:#7a3fb5;font:700 15px inherit;padding:11px 22px;border-radius:10px;cursor:pointer}
  .hide{display:none!important}
  code{background:rgba(0,0,0,.2);padding:2px 6px;border-radius:5px;word-break:break-all}
</style>
</head>
<body>
<iframe id="app" title="Chq & Cash Receiving" allow="clipboard-write; fullscreen" referrerpolicy="no-referrer-when-downgrade"></iframe>

<div id="splash"><div class="logo">₹</div><b style="font-size:19px">Chq &amp; Cash Receiving</b><div class="spin"></div><small>Khul raha hai...</small></div>
<div id="off" class="hide"><div class="logo">📶</div><b style="font-size:18px">Internet nahi hai</b><small>Net on karo, phir dobara try karo.</small><button onclick="start()">Dobara try karo</button></div>
<div id="setup" class="hide"><div class="logo">⚙️</div><b>Setup baaki hai</b><small>config.js mein apna Apps Script <code>/exec</code> link daalo.</small></div>

<div id="inst" class="hide" style="position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:9;display:flex;gap:8px;align-items:center;background:#fff;border-radius:14px;padding:8px 8px 8px 14px;box-shadow:0 10px 30px rgba(0,0,0,.25);font-size:13px;max-width:92vw">
  <span id="instTxt">📲 Ise app ki tarah install karo</span>
  <button id="instBtn" style="background:linear-gradient(135deg,#16a05d,#2b7de0);color:#fff;padding:8px 14px">Install</button>
  <button id="instX" style="background:#eee;color:#555;padding:8px 10px">✕</button>
</div>
<script>
  // Install button: Android/Chrome par seedha install, iPhone par tarika batata hai
  let deferred = null;
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const hidden = () => { try { return localStorage.getItem('instHide') === '1'; } catch (_) { return false; } };
  const show = () => { if (!standalone && !hidden()) document.getElementById('inst').classList.remove('hide'); };
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; show(); });
  window.addEventListener('appinstalled', () => document.getElementById('inst').classList.add('hide'));
  // Chrome khud prompt na de to bhi 3 sec baad tarika dikhao
  if (!ios && !standalone) setTimeout(() => { if (!deferred) { document.getElementById('instTxt').textContent = '📲 Install: upar ⋮ menu → "Install app" / "Add to Home screen"'; document.getElementById('instBtn').style.display = 'none'; show(); } }, 3000);
  window.addEventListener('beforeinstallprompt', () => { document.getElementById('instTxt').textContent = '📲 Ise app ki tarah install karo'; document.getElementById('instBtn').style.display = ''; });
  if (ios && !standalone) { document.getElementById('instTxt').textContent = '📲 Install: Share ⬆️ dabao → "Add to Home Screen"'; document.getElementById('instBtn').style.display = 'none'; setTimeout(show, 2500); }
  document.getElementById('instBtn').onclick = async () => { if (!deferred) return; deferred.prompt(); await deferred.userChoice; deferred = null; document.getElementById('inst').classList.add('hide'); };
  document.getElementById('instX').onclick = () => { document.getElementById('inst').classList.add('hide'); try { localStorage.setItem('instHide', '1'); } catch (_) {} };
</script>
<script src="config.js"></script>
<script>
  const $ = id => document.getElementById(id);
  function start() {
    const url = (window.APP_URL || '').trim();
    if (!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec/.test(url)) { $('splash').classList.add('hide'); $('setup').classList.remove('hide'); return; }
    if (!navigator.onLine) { $('splash').classList.add('hide'); $('off').classList.remove('hide'); return; }
    $('off').classList.add('hide'); $('splash').classList.remove('hide');
    // iPhone/iPad: Safari Google ko frame ke andar login/cookie nahi rakhne deta, isliye seedha kholo
    if (/iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) { location.replace(url); return; }
    const f = $('app');
    f.onload = () => setTimeout(() => $('splash').classList.add('hide'), 300);
    f.src = url;
    setTimeout(() => $('splash').classList.add('hide'), 15000);   // kisi wajah se onload na aaye to bhi
  }
  window.addEventListener('offline', () => $('off').classList.remove('hide'));
  window.addEventListener('online', () => { if (!$('off').classList.contains('hide')) start(); });
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  start();
</script>
</body>
</html>
